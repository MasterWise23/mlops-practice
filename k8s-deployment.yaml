apiVersion: apps/v1
kind: Deployment
metadata:
  name: wine-api-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wine-api
  template:
    metadata:
      labels:
        app: wine-api
    spec:
      containers:
        - name: wine-api
          image: wine-api
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: wine-api-service
spec:
  type: NodePort
  selector:
    app: wine-api
  ports:
    - port: 8000
      targetPort: 8000
